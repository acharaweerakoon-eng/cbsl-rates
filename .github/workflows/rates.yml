name: Fetch CBSL rates
on:
  schedule:
    - cron: '15 4-10 * * 1-5'   # hourly from 9:45am to 3:45pm Sri Lanka time, Mon-Fri
  workflow_dispatch:             # lets you run it by hand

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python fetch_rates.py
      - name: Save changes
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add usd_rates.json
          git diff --cached --quiet || git commit -m "Update rates"
          git push
